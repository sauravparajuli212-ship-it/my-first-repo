
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ninja Quest | PlayZone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101329;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:15px;background:#191d3c;border-bottom:2px solid #7c5cff}
header a{color:#b9a8ff;text-decoration:none}
h1{margin:8px;font-size:clamp(25px,6vw,38px)}
.subtitle{color:#c6c8e8;margin:8px}
.game-wrap{width:min(94%,850px);margin:18px auto}
.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{background:#20264a;padding:10px 16px;border-radius:12px;font-weight:bold}
canvas{display:block;width:100%;height:auto;background:#a9e7ff;border:3px solid #7660ff;border-radius:15px;touch-action:none}
.help{color:#c6c8e8;font-size:14px;line-height:1.6}
button{border:0;border-radius:12px;background:#7657ff;color:white;padding:13px 20px;font-size:16px;font-weight:bold;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:15px auto;max-width:420px}
.controls button{flex:1;min-height:60px;font-size:23px;user-select:none;-webkit-user-select:none}
#jump{background:#ff704f}
#message{font-weight:bold;min-height:25px;margin:10px}
footer{padding:20px;color:#aeb2d9}
@media(max-width:480px){.game-wrap{width:96%;margin:10px auto}.stat{padding:8px 10px;font-size:14px}.controls{gap:10px}.controls button{min-height:65px;padding:10px}}
</style>
</head>
<body>
<header>
  <a href="index.html">← Back to PlayZone</a>
  <h1>🥷 Ninja Quest</h1>
  <p class="subtitle">Run, jump, collect coins and avoid obstacles!</p>
</header>

<main class="game-wrap">
  <div class="stats">
    <div class="stat">⭐ Score: <span id="score">0</span></div>
    <div class="stat">🪙 Coins: <span id="coins">0</span></div>
    <div class="stat">❤️ Lives: <span id="lives">3</span></div>
  </div>

  <canvas id="game" width="800" height="400" aria-label="Ninja running game"></canvas>

  <div class="controls">
    <button id="left" aria-label="Move left">⬅️</button>
    <button id="jump" aria-label="Jump">⬆️ JUMP</button>
    <button id="right" aria-label="Move right">➡️</button>
  </div>

  <button id="restart">🔄 Restart Game</button>
  <p id="message">Press Start Game to begin!</p>
  <p class="help">Computer: ← → to move, Space or ↑ to jump.<br>Mobile: use the on-screen buttons.</p>
</main>
<footer>PlayZone 🎮 · Keep practicing, ninja!</footer>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const livesEl=document.getElementById("lives");
const message=document.getElementById("message");

const W=800,H=400,ground=340;
let player,obstacles,coins,score,coinCount,lives,speed,frame,running,started,keys,raf;

function reset(){
  if(raf)cancelAnimationFrame(raf);
  player={x:100,y:ground-48,w:34,h:48,vy:0,onGround:true};
  obstacles=[];coins=[];score=0;coinCount=0;lives=3;speed=5;frame=0;
  running=true;started=true;keys={left:false,right:false};
  scoreEl.textContent=score;coinsEl.textContent=coinCount;livesEl.textContent=lives;
  message.textContent="Go, ninja! Collect coins and dodge obstacles!";
  raf=requestAnimationFrame(loop);
}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function draw(){
  // Sky and distant hills
  let sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#8ce1ff");sky.addColorStop(1,"#f0fcff");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fd69a";
  ctx.beginPath();ctx.moveTo(0,270);
  for(let x=0;x<=W;x+=80)ctx.lineTo(x,245+Math.sin(x/70+frame/100)*22);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  rect(0,ground,W,H-ground,"#344b40");
  rect(0,ground,W,7,"#78e08f");
  for(let x=-(frame*speed*.5%50);x<W;x+=50)rect(x,ground+25,24,4,"#506c53");

  // Coins
  coins.forEach(c=>{
    ctx.fillStyle="#ffcb35";ctx.beginPath();ctx.arc(c.x,c.y,11,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff3a0";ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle="#986000";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillText("$",c.x,c.y+5);
  });

  // Obstacles
  obstacles.forEach(o=>{
    rect(o.x,o.y,o.w,o.h,"#e85d75");
    rect(o.x+5,o.y+5,o.w-10,7,"#ffb2b9");
    ctx.fillStyle="#6d2646";
    ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w/2,o.y-13);ctx.lineTo(o.x+o.w,o.y);ctx.fill();
  });

  // Ninja body
  rect(player.x+8,player.y+17,20,27,"#29264f");
  rect(player.x+3,player.y+21,8,18,"#7657ff");
  rect(player.x+7,player.y+2,25,22,"#24223f");
  rect(player.x+4,player.y+9,30,8,"#f3f3ff");
  rect(player.x+20,player.y+11,7,4,"#ffcb35");
  rect(player.x+10,player.y+42,7,9,"#16172a");
  rect(player.x+23,player.y+42,7,9,"#16172a");
  rect(player.x+1,player.y+5,12,6,"#e85d75");

  if(!running){
    rect(0,0,W,H,"rgba(15,18,42,.65)");
    ctx.textAlign="center";ctx.fillStyle="white";
    ctx.font="bold 42px Arial";ctx.fillText(lives===0?"GAME OVER!":"NINJA QUEST",W/2,170);
    ctx.font="bold 23px Arial";ctx.fillText("Score: "+score+"   Coins: "+coinCount,W/2,215);
    ctx.font="18px Arial";ctx.fillText("Tap Restart Game to play again",W/2,255);
  }
}
function spawn(){
  if(frame%75===0){
    obstacles.push({x:W+20,y:ground-34,w:30,h:34});
  }
  if(frame%95===0){
    coins.push({x:W+10,y:ground-75-Math.random()*75,r:11});
  }
}
function overlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function loop(){
  if(!running){draw();return}
  frame++;score++;speed=5+Math.min(score/500,4);
  if(keys.left)player.x-=4;
  if(keys.right)player.x+=4;
  player.x=Math.max(0,Math.min(W-player.w,player.x));
  player.y+=player.vy;
  player.vy+=.65;
  if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true}
  spawn();

  obstacles.forEach(o=>o.x-=speed);
  coins.forEach(c=>c.x-=speed);

  obstacles=obstacles.filter(o=>o.x+o.w>0);
  coins=coins.filter(c=>c.x+12>0);

  obstacles.forEach(o=>{
    if(!o.hit&&overlap(player,{x:o.x+3,y:o.y+3,w:o.w-6,h:o.h-3})){
      o.hit=true;lives--;livesEl.textContent=lives;
      player.x=Math.max(0,player.x-35);
      if(lives<=0){running=false;message.textContent="Game over! Try again to beat your score."}
    }
  });

  coins=coins.filter(c=>{
    const got=overlap(player,{x:c.x-10,y:c.y-10,w:20,h:20});
    if(got){coinCount++;score+=25;coinsEl.textContent=coinCount;scoreEl.textContent=score}
    return !got;
  });

  scoreEl.textContent=score;
  draw();
  if(running)raf=requestAnimationFrame(loop);
}

function jump(){
  if(!started){reset();return}
  if(running&&player.onGround){player.vy=-13;player.onGround=false}
}
document.getElementById("restart").addEventListener("click",reset);
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
function holdButton(id,key){
  const b=document.getElementById(id);
  b.addEventListener("pointerdown",e=>{e.preventDefault();if(!started)reset();keys[key]=true});
  ["pointerup","pointercancel","pointerleave"].forEach(evt=>b.addEventListener(evt,()=>keys[key]=false));
}
holdButton("left","left");holdButton("right","right");
window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault();
  if(e.key==="ArrowLeft")keys.left=true;
  if(e.key==="ArrowRight")keys.right=true;
  if(e.key==="ArrowUp"||e.key===" ")jump();
  if(e.key==="Enter"&&!running)reset();
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft")keys.left=false;
  if(e.key==="ArrowRight")keys.right=false;
});
window.addEventListener("blur",()=>{if(keys){keys.left=false;keys.right=false}});
started=false;running=false;
player={x:100,y:ground-48,w:34,h:48,vy:0,onGround:true};
obstacles=[];coins=[];score=0;coinCount=0;lives=3;speed=5;frame=0;keys={left:false,right:false};
draw();
message.textContent="Press Start Game to begin!";
const startBtn=document.createElement("button");
startBtn.textContent="▶ Start Game";
startBtn.style.margin="0 0 12px";
startBtn.addEventListener("click",reset);
document.querySelector(".game-wrap").insertBefore(startBtn,canvas);
</script>
</body>
</html>
