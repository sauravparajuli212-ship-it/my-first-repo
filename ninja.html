
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninja Quest - PlayZone</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 20px;
        background: #101827;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    h1 { color: #00e5ff; margin-bottom: 8px; }
    .info { margin: 12px; color: #dce5f5; }
    canvas {
        width: 100%;
        max-width: 900px;
        background: #b8e9ff;
        border: 3px solid #00e5ff;
        border-radius: 12px;
        display: block;
        margin: 15px auto;
    }
    button {
        padding: 12px 22px;
        border: 0;
        border-radius: 10px;
        background: #7048ff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin: 5px;
    }
    button:hover { background: #8a6bff; }
</style>
</head>
<body>

<h1>🥷 Ninja Quest</h1>
<p class="info">Collect the coins, avoid the spikes, and reach the flag!</p>
<p class="info">
    Coins: <span id="score">0</span> |
    Move: A/D or ←/→ |
    Jump: W, ↑ or Space
</p>

<canvas id="game" width="900" height="450"></canvas>

<button onclick="restartGame()">🔄 Restart Game</button>
<p id="status">Ready, ninja? Use your keyboard to start!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const statusText = document.getElementById("status");

const worldWidth = 2400;
const gravity = 0.65;

const platforms = [
    {x:0, y:390, w:400, h:60},
    {x:480, y:350, w:250, h:100},
    {x:790, y:310, w:220, h:140},
    {x:1080, y:370, w:300, h:80},
    {x:1450, y:330, w:230, h:120},
    {x:1750, y:285, w:220, h:165},
    {x:2040, y:360, w:360, h:90}
];

const startingCoins = [
    {x:180, y:330},
    {x:330, y:310},
    {x:550, y:290},
    {x:660, y:290},
    {x:850, y:250},
    {x:960, y:250},
    {x:1170, y:320},
    {x:1320, y:320},
    {x:1510, y:270},
    {x:1620, y:270},
    {x:1820, y:225},
    {x:1920, y:225},
    {x:2130, y:310},
    {x:2260, y:310}
];

let player, coins, score, cameraX, gameOver, won;
const keys = {};

function restartGame() {
    player = {
        x: 50, y: 320, w: 34, h: 42,
        vx: 0, vy: 0, grounded: false
    };
    coins = startingCoins.map(c => ({...c, collected:false}));
    score = 0;
    cameraX = 0;
    gameOver = false;
    won = false;
    scoreText.textContent = score;
    statusText.textContent = "Collect coins and find the flag!";
}

document.addEventListener("keydown", e => {
    if (["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))
        e.preventDefault();
    keys[e.code] = true;
    if (!e.repeat && ["Space","ArrowUp","KeyW"].includes(e.code))
        jump();
    if (e.code === "Enter" && (gameOver || won))
        restartGame();
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

function jump() {
    if (player && player.grounded && !gameOver && !won) {
        player.vy = -13;
        player.grounded = false;
    }
}

function overlap(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

function update() {
    if (gameOver || won) return;

    player.vx = 0;
    if (keys.ArrowRight || keys.KeyD) player.vx = 4.5;
    if (keys.ArrowLeft || keys.KeyA) player.vx = -4.5;

    player.x += player.vx;
    player.x = Math.max(0, Math.min(worldWidth - player.w, player.x));

    const oldBottom = player.y + player.h;
    player.vy += gravity;
    player.y += player.vy;
    player.grounded = false;

    for (const p of platforms) {
        const horizontal = player.x + player.w > p.x &&
                           player.x < p.x + p.w;
        if (horizontal && player.vy >= 0 &&
            oldBottom <= p.y && player.y + player.h >= p.y) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
        }
    }

    // Collect coins
    for (const coin of coins) {
        if (!coin.collected &&
            overlap(player, {x:coin.x-12,y:coin.y-12,w:24,h:24})) {
            coin.collected = true;
            score++;
            scoreText.textContent = score;
        }
    }

    // Dangerous spikes
    const spikes = [
        {x:285,y:365,w:55,h:25},
        {x:570,y:325,w:50,h:25},
        {x:1190,y:345,w:55,h:25},
        {x:1510,y:305,w:50,h:25},
        {x:1830,y:260,w:55,h:25},
        {x:2150,y:335,w:55,h:25}
    ];

    for (const s of spikes) {
        if (overlap(player, {
            x:s.x+7, y:s.y+8, w:s.w-14, h:s.h-8
        })) {
            gameOver = true;
            statusText.textContent =
                "Oops! Try again. Press Restart Game.";
        }
    }

    if (player.y > canvas.height + 120) {
        gameOver = true;
        statusText.textContent = "You fell! Press Restart Game to retry.";
    }

    // Reach the finish flag
    if (player.x > 2310 && !gameOver) {
        won = true;
        statusText.textContent =
            "🎉 You won! Coins collected: " + score +
            " out of " + coins.length + ". Press Enter to play again.";
    }

    cameraX = Math.max(0, Math.min(
        worldWidth - canvas.width,
        player.x - canvas.width * 0.35
    ));
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Sky and clouds
    ctx.fillStyle = "#b8e9ff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#ffffff";
    for(let i=0;i<8;i++) {
        let x = ((i*190 - cameraX*0.25) % 1100 + 1100) % 1100 - 80;
        ctx.beginPath();
        ctx.arc(x,75,24,0,Math.PI*2);
        ctx.arc(x+25,65,30,0,Math.PI*2);
        ctx.arc(x+53,77,22,0,Math.PI*2);
        ctx.fill();
    }

    ctx.save();
    ctx.translate(-cameraX,0);

    // Platforms
    for(const p of platforms) {
        ctx.fillStyle = "#603b2a";
        ctx.fillRect(p.x,p.y,p.w,p.h);
        ctx.fillStyle = "#23b85a";
        ctx.fillRect(p.x,p.y,p.w,12);
    }

    // Spikes
    const spikes = [
        {x:285,y:365,w:55,h:25},
        {x:570,y:325,w:50,h:25},
        {x:1190,y:345,w:55,h:25},
        {x:1510,y:305,w:50,h:25},
        {x:1830,y:260,w:55,h:25},
        {x:2150,y:335,w:55,h:25}
    ];
    for(const s of spikes) {
        ctx.fillStyle = "#f04455";
        for(let x=s.x; x<s.x+s.w; x+=18) {
            ctx.beginPath();
            ctx.moveTo(x,s.y+s.h);
            ctx.lineTo(x+9,s.y);
            ctx.lineTo(x+18,s.y+s.h);
            ctx.fill();
        }
    }

    // Coins
    for(const c of coins) {
        if(c.collected) continue;
        ctx.fillStyle = "#ffbd22";
        ctx.beginPath();
        ctx.arc(c.x,c.y,11,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "#fff3a4";
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    // Finish flag
    ctx.fillStyle = "#344054";
    ctx.fillRect(2350,265,6,95);
    ctx.fillStyle = "#ff4c78";
    ctx.beginPath();
    ctx.moveTo(2356,265);
    ctx.lineTo(2400,280);
    ctx.lineTo(2356,298);
    ctx.fill();

    // Ninja character
    ctx.font = "38px Arial";
    ctx.textAlign = "left";
    ctx.fillText("🥷",player.x-4,player.y+36);

    ctx.restore();

    if (gameOver || won) {
        ctx.fillStyle = "#101827dd";
        ctx.fillRect(180,155,540,110);
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "bold 27px Arial";
        ctx.fillText(won ? "LEVEL COMPLETE!" : "GAME OVER",450,200);
        ctx.font = "17px Arial";
        ctx.fillText("Press Restart Game to play again",450,233);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

restartGame();
loop();
</script>
</body>
</html>
