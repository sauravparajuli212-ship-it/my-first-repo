
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninja Quest 3D | PlayZone</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#08111f;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#101b2dcc;border:1px solid #ffffff30;padding:10px 14px;border-radius:14px;backdrop-filter:blur(8px);font-weight:bold}
.small{font-size:12px;color:#a8c4e8;margin-bottom:5px}
#score,#coins{font-size:22px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101dbb;padding:20px;text-align:center}
.card{max-width:420px;width:100%;padding:28px 22px;border-radius:24px;background:#101d31ed;border:1px solid #ffffff30;box-shadow:0 20px 80px #0008}
h1{font-size:clamp(30px,8vw,48px);margin:0 0 8px;color:#69f0d0}
.card p{color:#d0def2;line-height:1.6}
button{border:0;border-radius:13px;padding:13px 18px;font-weight:bold;font-size:16px;cursor:pointer}
#start{background:#69f0d0;color:#07121e;width:100%;margin-top:10px}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.group{display:flex;gap:10px}
.ctrl{pointer-events:auto;width:62px;height:58px;background:#142641dd;color:white;border:1px solid #ffffff50;font-size:23px;touch-action:manipulation;user-select:none}
#hint{position:fixed;bottom:94px;left:0;right:0;text-align:center;color:#ffffffb0;font-size:12px;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
  <div class="panel">
    <div class="small">DISTANCE</div>
    <div id="score">0 m</div>
  </div>
  <div class="panel">
    <div class="small">🪙 COINS</div>
    <div id="coins">0</div>
  </div>
  <div class="panel">
    <div class="small">BEST</div>
    <div id="best">0 m</div>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div style="font-size:60px">🥷</div>
    <h1 id="title">NINJA QUEST 3D</h1>
    <p id="message">Run through the neon ninja world! Switch lanes, jump over barriers and collect golden coins.</p>
    <p style="font-size:13px">PC: A/D or ←/→ to move · Space to jump<br>Mobile: Use the on-screen buttons</p>
    <button id="start">START RUN ▶</button>
  </div>
</div>

<div id="hint">MOVE ◀ ▶ &nbsp; · &nbsp; JUMP ⬆</div>
<div id="controls">
  <div class="group">
    <button class="ctrl" id="left" aria-label="Move left">◀</button>
    <button class="ctrl" id="right" aria-label="Move right">▶</button>
  </div>
  <div class="group">
    <button class="ctrl" id="jump" aria-label="Jump">⬆</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const host = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09172a);
scene.fog = new THREE.Fog(0x09172a, 28, 100);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 150);
camera.position.set(0, 5.5, 10);
camera.lookAt(0, 1, -5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb8e5ff, 0x172030, 2));
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(-5, 12, 7);
sun.castShadow = true;
scene.add(sun);

const mat = (color, extra={}) => new THREE.MeshStandardMaterial({color, ...extra});
const roadMat = mat(0x202c40, {roughness:0.85});
const neonMat = mat(0x37e8d0, {emissive:0x087968, emissiveIntensity:1.5});
const goldMat = mat(0xffc928, {metalness:0.65, roughness:0.25, emissive:0x885500, emissiveIntensity:0.5});

const floor = new THREE.Mesh(new THREE.PlaneGeometry(11, 150), roadMat);
floor.rotation.x = -Math.PI/2;
floor.position.set(0, -0.08, -45);
floor.receiveShadow = true;
scene.add(floor);

// Road edges and lane markers
for (const x of [-5.3, 5.3]) {
  const edge = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 150), neonMat);
  edge.position.set(x, 0, -45);
  scene.add(edge);
}
const dashes = [];
for (const x of [-1.75, 1.75]) {
  for (let i=0; i<20; i++) {
    const dash = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.025, 2.1), mat(0x7590b3));
    dash.position.set(x, 0, -i*5);
    scene.add(dash);
    dashes.push(dash);
  }
}

// Futuristic scenery
const buildings = [];
for (let i=0; i<34; i++) {
  for (const side of [-1,1]) {
    const h = 2 + Math.random()*8;
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(2+Math.random()*2,h,2+Math.random()*4),
      mat(side===-1 ? 0x172d4a : 0x222547, {roughness:0.8})
    );
    b.position.set(side*(8+Math.random()*5),h/2-0.1,-i*5-5);
    scene.add(b);
    buildings.push(b);
  }
}

// Build a simple 3D ninja from shapes
const player = new THREE.Group();
scene.add(player);
const black = mat(0x151b2b, {roughness:0.8});
const cloth = mat(0x252f49);
const red = mat(0xff365e, {emissive:0x771020, emissiveIntensity:0.4});
const skin = mat(0xe7b28a);

function part(parent, geometry, material, x,y,z) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

part(player,new THREE.CapsuleGeometry(0.36,0.62,4,8),black,0,1.05,0);
part(player,new THREE.SphereGeometry(0.34,16,12),cloth,0,1.78,0);
part(player,new THREE.BoxGeometry(0.55,0.13,0.5),red,0,1.75,-0.03);
part(player,new THREE.BoxGeometry(0.48,0.09,0.06),skin,0,1.78,0.29);
part(player,new THREE.BoxGeometry(0.65,0.12,0.12),red,-0.4,1.88,-0.03);
part(player,new THREE.BoxGeometry(0.65,0.12,0.12),red,0.4,1.88,-0.03);

const legs = [];
for (const x of [-0.19,0.19]) {
  const leg = part(player,new THREE.BoxGeometry(0.22,0.55,0.25),black,x,0.43,0);
  legs.push(leg);
}
const arms = [];
for (const x of [-0.43,0.43]) {
  const arm = part(player,new THREE.BoxGeometry(0.19,0.58,0.2),cloth,x,1.12,0);
  arms.push(arm);
}
part(player,new THREE.BoxGeometry(0.72,0.12,0.16),red,0,1.25,-0.33);

// Objects approaching the player
const obstacles = [];
const coinsList = [];
let running = false, ended = false;
let lane = 0, jumpY = 0, jumpV = 0;
let distance = 0, coinCount = 0, speed = 17, spawnTimer = 0;
let best = Number(localStorage.getItem('ninja3dBest') || 0);
document.getElementById('best').textContent = Math.floor(best)+' m';

function makeObstacle(z) {
  const laneIndex = Math.floor(Math.random()*3)-1;
  const group = new THREE.Group();
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(1.05,1.05,0.9),
    mat(0xf0445d,{roughness:0.35,metalness:0.25,emissive:0x420610})
  );
  box.position.y = 0.53;
  box.castShadow = true;
  group.add(box);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.08,0.12,0.94),goldMat);
  stripe.position.y = 0.65;
  group.add(stripe);
  group.position.set(laneIndex*3.5,0,z);
  scene.add(group);
  obstacles.push({group,lane:laneIndex,hit:false});
}

function makeCoin(z, laneIndex) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.35,0.11,10,20),goldMat);
  mesh.position.set(laneIndex*3.5,1.35,z);
  mesh.castShadow = true;
  scene.add(mesh);
  coinsList.push({mesh,lane:laneIndex,got:false});
}

function spawnWave() {
  const obstacleLane = Math.floor(Math.random()*3)-1;
  makeObstacle(-65);
  // Coins sometimes appear in another lane, leaving room to dodge.
  if (Math.random()<0.9) {
    let coinLane = Math.floor(Math.random()*3)-1;
    for(let i=0;i<5;i++) makeCoin(-45-i*2.1,coinLane);
  }
  if (Math.random()<0.48) {
    let safeLane = [-1,0,1].find(n=>n!==obstacleLane);
    makeCoin(-62,safeLane);
  }
}

function clearObjects() {
  for(const o of obstacles) scene.remove(o.group);
  for(const c of coinsList) scene.remove(c.mesh);
  obstacles.length=0;
  coinsList.length=0;
}

function reset() {
  clearObjects();
  lane=0; jumpY=0; jumpV=0;
  distance=0; coinCount=0; speed=17; spawnTimer=0;
  player.position.set(0,0,0);
  player.rotation.set(0,0,0);
  for(const d of dashes) d.position.z = -Math.abs(d.position.z % 100);
  running=true; ended=false;
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('hint').classList.remove('hidden');
  spawnWave();
}

function moveLane(dir) {
  if(!running) return;
  lane=Math.max(-1,Math.min(1,lane+dir));
}
function jump() {
  if(!running || jumpY>0.02) return;
  jumpV=9.5;
}
function finish() {
  if(!running) return;
  running=false; ended=true;
  best=Math.max(best,Math.floor(distance));
  localStorage.setItem('ninja3dBest',best);
  document.getElementById('best').textContent=best+' m';
  document.getElementById('title').textContent='RUN OVER!';
  document.getElementById('message').textContent=
    'Distance: '+Math.floor(distance)+' m · Coins: '+coinCount+'. Ready for another run?';
  document.getElementById('start').textContent='PLAY AGAIN ↻';
  document.getElementById('overlay').classList.remove('hidden');
}

document.getElementById('start').addEventListener('click',reset);
document.getElementById('left').addEventListener('click',()=>moveLane(-1));
document.getElementById('right').addEventListener('click',()=>moveLane(1));
document.getElementById('jump').addEventListener('click',jump);

window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)) e.preventDefault();
  if(e.repeat) return;
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a') moveLane(-1);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d') moveLane(1);
  if(e.key==='ArrowUp'||e.key===' '||e.key.toLowerCase()==='w') jump();
  if(e.key==='Enter'&&!running) reset();
});

let touchX=null;
renderer.domElement.addEventListener('touchstart',e=>{
  touchX=e.touches[0].clientX;
},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{
  if(touchX===null) return;
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>35) moveLane(dx>0?1:-1);
  touchX=null;
},{passive:true});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);
  const t=clock.elapsedTime;

  // Ninja idle/run animation
  if(running) {
    distance+=speed*dt/5;
    speed=Math.min(29,17+distance*0.012);
    spawnTimer+=dt;
    if(spawnTimer>Math.max(0.85,1.65-distance*0.001)) {
      spawnTimer=0;
      spawnWave();
    }

    jumpV-=22*dt;
    jumpY+=jumpV*dt;
    if(jumpY<0){jumpY=0;jumpV=0}
    player.position.y=jumpY;
    player.position.x=THREE.MathUtils.damp(player.position.x,lane*3.5,12,dt);
    player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-(lane*0.12),8,dt);
    legs[0].rotation.x=Math.sin(t*14)*0.65*(jumpY===0?1:0.15);
    legs[1].rotation.x=-Math.sin(t*14)*0.65*(jumpY===0?1:0.15);
    arms[0].rotation.x=-Math.sin(t*14)*0.5;
    arms[1].rotation.x=Math.sin(t*14)*0.5;

    for(const d of dashes) {
      d.position.z+=speed*dt;
      if(d.position.z>8) d.position.z-=100;
    }
    for(const b of buildings) {
      b.position.z+=speed*dt*0.75;
      if(b.position.z>12) b.position.z-=170;
    }

    for(const o of obstacles) {
      o.group.position.z+=speed*dt;
      if(!o.hit && o.group.position.z> -0.2 && o.group.position.z<0.8 &&
         Math.abs(player.position.x-o.group.position.x)<1.05 && jumpY<0.95) {
        o.hit=true;
        finish();
      }
    }
    for(const c of coinsList) {
      c.mesh.rotation.y+=dt*4;
      c.mesh.position.z+=speed*dt;
      if(!c.got && c.mesh.position.z> -0.5 && c.mesh.position.z<0.7 &&
         Math.abs(player.position.x-c.mesh.position.x)<1.25 && jumpY<2.2) {
        c.got=true;
        coinCount++;
        scene.remove(c.mesh);
      }
    }
    for(let i=obstacles.length-1;i>=0;i--) {
      if(obstacles[i].group.position.z>12) {
        scene.remove(obstacles[i].group);obstacles.splice(i,1);
      }
    }
    for(let i=coinsList.length-1;i>=0;i--) {
      if(coinsList[i].got||coinsList[i].mesh.position.z>12) {
        scene.remove(coinsList[i].mesh);coinsList.splice(i,1);
      }
    }
    document.getElementById('score').textContent=Math.floor(distance)+' m';
    document.getElementById('coins').textContent=coinCount;
  } else {
    player.position.y=Math.sin(t*2)*0.04;
    player.rotation.y=Math.sin(t)*0.08;
    for(const c of coinsList) c.mesh.rotation.y+=dt;
  }

  camera.position.x=THREE.MathUtils.damp(camera.position.x,player.position.x*0.18,3,dt);
  camera.lookAt(player.position.x*0.12,1.0,-5);
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
