
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty King | PlayZone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:18px;background:#101f38}
h1{margin:0;color:#57f5a4;font-size:clamp(27px,6vw,42px)}
p{color:#c7d5e9}
main{width:min(94%,650px);margin:20px auto}
.stats{display:flex;justify-content:space-around;gap:10px;margin:12px 0}
.stat{background:#172b46;border-radius:12px;padding:12px;flex:1}
.stat strong{display:block;color:#57f5a4;font-size:24px;margin-top:5px}
canvas{display:block;width:100%;border:3px solid #57f5a4;border-radius:14px;background:#188447;touch-action:manipulation}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
button{border:0;border-radius:10px;padding:13px 19px;font-size:16px;font-weight:bold;cursor:pointer;background:#57f5a4;color:#071426}
button:active{transform:scale(.97)}
#message{min-height:26px;font-weight:bold;color:#ffe16a}
small{color:#b6c6dc}
</style>
</head>
<body>
<header>
<h1>⚽ PENALTY KING</h1>
<p>Choose your aim. Beat the keeper. Become the champion!</p>
</header>
<main>
<div class="stats">
<div class="stat">GOALS<strong id="goals">0</strong></div>
<div class="stat">SHOTS<strong id="shots">0</strong></div>
<div class="stat">ROUND<strong id="round">1</strong></div>
</div>
<canvas id="field" width="600" height="420"></canvas>
<p id="message">Tap anywhere in the goal to aim, then shoot!</p>
<div class="controls">
<button id="shoot">⚽ SHOOT!</button>
<button id="restart">↻ Restart</button>
</div>
<small>PC: click the goal to aim. Mobile: tap the goal to aim. Then press SHOOT!</small>
</main>
<script>
const canvas=document.getElementById("field");
const ctx=canvas.getContext("2d");
const goalsEl=document.getElementById("goals");
const shotsEl=document.getElementById("shots");
const roundEl=document.getElementById("round");
const message=document.getElementById("message");
let goals=0,shots=0,round=1,busy=false,aimX=300,aimY=100;
let ballX=300,ballY=355,ballR=13;
let keeperX=300,keeperY=105;
let result="",kickTime=0,kickStart=null,kickEnd=null;
function draw(){
 const w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);
 // Pitch
 ctx.fillStyle="#188447";ctx.fillRect(0,0,w,h);
 for(let y=0;y<h;y+=80){ctx.fillStyle="rgba(255,255,255,.035)";ctx.fillRect(0,y,w,40)}
 ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=3;
 ctx.strokeRect(55,25,490,180);
 ctx.strokeRect(150,25,300,105);
 // Goal net
 ctx.fillStyle="#dcebf3";ctx.fillRect(145,22,310,12);
 ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.strokeRect(145,22,310,125);
 ctx.lineWidth=1;ctx.strokeStyle="rgba(255,255,255,.45)";
 for(let x=160;x<450;x+=20){ctx.beginPath();ctx.moveTo(x,25);ctx.lineTo(x,145);ctx.stroke()}
 for(let y=40;y<145;y+=20){ctx.beginPath();ctx.moveTo(145,y);ctx.lineTo(455,y);ctx.stroke()}
 // Keeper
 ctx.save();ctx.translate(keeperX,keeperY);
 ctx.strokeStyle="#f4d29a";ctx.lineWidth=13;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-43,-15);ctx.moveTo(8,0);ctx.lineTo(43,-15);ctx.stroke();
 ctx.fillStyle="#ffb52e";ctx.fillRect(-19,-10,38,37);
 ctx.fillStyle="#f1c49a";ctx.beginPath();ctx.arc(0,-23,13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#e8f3ff";ctx.fillRect(-17,26,13,25);ctx.fillRect(4,26,13,25);
 ctx.restore();
 // Aim indicator
 if(!busy){
 ctx.setLineDash([7,7]);ctx.strokeStyle="#fff36c";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(ballX,ballY-12);ctx.lineTo(aimX,aimY);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle="#fff36c";ctx.beginPath();ctx.arc(aimX,aimY,7,0,Math.PI*2);ctx.fill();
 }
 // Ball
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ballX,ballY,ballR,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#202b36";ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle="#202b36";ctx.beginPath();ctx.arc(ballX,ballY,5,0,Math.PI*2);ctx.fill();
}
function updateStats(){
 goalsEl.textContent=goals;shotsEl.textContent=shots;roundEl.textContent=round;
}
function resetBall(){ballX=300;ballY=355;ballR=13;keeperX=300;keeperY=105;busy=false;kickStart=null;kickEnd=null;draw()}
function chooseAim(e){
 if(busy)return;
 const rect=canvas.getBoundingClientRect();
 const x=(e.clientX-rect.left)*canvas.width/rect.width;
 const y=(e.clientY-rect.top)*canvas.height/rect.height;
 if(x>=145&&x<=455&&y>=25&&y<=147){aimX=x;aimY=y;message.textContent="Aim locked! Now shoot!";draw()}
}
canvas.addEventListener("pointerdown",chooseAim);
function shoot(){
 if(busy)return;
 busy=true;shots++;
 const targetX=Math.max(155,Math.min(445,aimX));
 const targetY=Math.max(35,Math.min(135,aimY));
 const keeperTarget=300+(Math.random()-.5)*300;
 keeperX=Math.max(175,Math.min(425,keeperTarget));
 const distance=Math.abs(targetX-keeperX);
 const saves=distance<48&&Math.random()<(0.78-(Math.min(round,8)*.035));
 kickStart={x:ballX,y:ballY,r:13};
 kickEnd={x:saves?keeperX:targetX,y:saves?keeperY+15:targetY,r:7};
 kickTime=0;message.textContent="GOOOO!";updateStats();
 animateKick(saves);
}
function animateKick(saves){
 const start=performance.now(),duration=550;
 function frame(now){
  kickTime=Math.min(1,(now-start)/duration);
  ballX=kickStart.x+(kickEnd.x-kickStart.x)*kickTime;
  ballY=kickStart.y+(kickEnd.y-kickStart.y)*kickTime;
  ballR=13-6*kickTime;
  draw();
  if(kickTime<1){requestAnimationFrame(frame);return}
  if(saves){message.textContent="🧤 SAVED! The keeper got it!";keeperX=ballX}
  else if(aimX<165||aimX>435){message.textContent="❌ Wide! Aim inside the goal!"}
  else{goals++;message.textContent="⚽ GOOOAL! Amazing shot!"; }
  round++;updateStats();
  setTimeout(resetBall,1000);
 }
 requestAnimationFrame(frame);
}
document.getElementById("shoot").addEventListener("click",shoot);
document.getElementById("restart").addEventListener("click",()=>{
 goals=0;shots=0;round=1;aimX=300;aimY=80;
 updateStats();message.textContent="New match! Aim and shoot!";resetBall();
});
draw();
</script>
</body>
</html>
